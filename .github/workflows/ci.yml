name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run black --check

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=mcp_server/src/tools --cov-report=term-missing --cov-report=xml
