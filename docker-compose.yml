services:
  
  mcp_server:
    build: ./mcp_server
    ports:
      - "8000:8000"
    volumes:
      - shared_data:/app/data

  streamlit:
    build: ./streamlit_app
    ports:
      - "8501:8501"
    environment:
      - MCP_SERVER_URL=http://mcp_server:8000/sse
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      - shared_data:/app/data
    depends_on:
      - mcp_server

volumes:
  shared_data:
